server:
  port: 80

spring:
  application:
    name: demo-k8s-otel-java
  profiles:
    include:
      - knife4j
  redis:
    host: redis
    port: 6379

# 配置日志地址
logging:
  config: classpath:logback-spring.xml
  pattern:
    level: "%5p [trace_id=%X{trace_id} span_id=%X{span_id} trace_flags=%X{trace_flags}]"
